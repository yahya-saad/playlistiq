<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaylistIQ | Simple YouTube Playlist Duration Calculator</title>
    <meta name="description" content="Simple tool to calculate how long a YouTube playlist will take.">
    <meta name="keywords" content="YouTube, Playlist, Duration, Calculator, Time, Length, Playback Speed">
    <meta property="og:title" content="PlaylistIQ - YouTube Playlist Duration Calculator">
    <meta property="og:description" content="Simple tool to calculate how long a YouTube playlist will take.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Production Assets -->
    <link rel="stylesheet" href="./output.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./app.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body class="bg-slate-50 min-h-screen text-slate-900 font-sans selection:bg-blue-100 selection:text-blue-900"
    x-data="calculatorData()" x-cloak @keydown.window="handleKeydown($event)">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 group cursor-default">
                <div
                    class="h-10 w-10 md:h-12 md:w-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20 group-hover:scale-105 group-hover:rotate-3 transition-transform">
                    <i data-lucide="bar-chart-3" class="h-6 w-6 md:h-7 md:w-7 text-white"></i>
                </div>
                <div>
                    <h1 class="font-black text-xl md:text-2xl tracking-tight text-slate-900">PlaylistIQ</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button @click="copyShareLink()"
                    class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-900 hover:text-white hover:shadow-lg hover:shadow-slate-900/10 active:scale-95 transition-all text-sm">
                    <i data-lucide="share-2" class="h-4 w-4"></i>
                    <span>Share Link</span>
                </button>
                <a href="https://github.com/yahya-saad/playlistiq" target="_blank"
                    class="h-10 w-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-slate-900 hover:bg-slate-100 transition-all border-l border-slate-200 ml-2 pl-4">
                    <i data-lucide="github" class="h-5 w-5"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <!-- Hero section -->
        <div class="mb-12 text-center md:text-left">
            <p class="text-slate-500 text-lg md:text-xl font-medium max-w-2xl leading-relaxed">Simple tool to calculate
                how long a YouTube playlist will take.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <!-- Input Panel -->
            <div class="lg:col-span-8 space-y-6">
                <!-- Errors List -->
                <template x-if="errors.length > 0">
                    <div class="bg-red-50 border border-red-100 rounded-2xl p-4 space-y-2">
                        <template x-for="err in errors">
                            <div class="flex items-center gap-3 text-red-600 text-xs font-bold">
                                <i data-lucide="alert-circle" class="h-3.5 w-3.5"></i>
                                <span x-text="'Issue with ' + err.id + ': ' + err.error"></span>
                            </div>
                        </template>
                    </div>
                </template>

                <div
                    class="bg-white p-6 md:p-10 rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-xl hover:shadow-blue-500/5 transition-all">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="h-8 w-8 rounded-lg bg-blue-50 flex items-center justify-center">
                            <i data-lucide="list-video" class="h-4 w-4 text-blue-600"></i>
                        </div>
                        <span class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Playlist Queue</span>
                    </div>

                    <div class="space-y-4">
                        <textarea x-model="rawUrls" @paste.stop="handlePaste($event)"
                            class="w-full h-64 p-6 md:p-8 rounded-2xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-8 focus:ring-blue-500/5 transition-all outline-none resize-none font-mono text-sm md:text-base leading-relaxed"
                            placeholder="Paste playlist URLs or IDs here..."></textarea>

                        <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
                            <div class="flex-1 w-full">
                                <p x-show="error"
                                    class="text-sm text-red-600 font-bold flex items-center gap-3 bg-red-50 p-4 rounded-xl border border-red-100">
                                    <i data-lucide="alert-circle" class="h-4 w-4"></i>
                                    <span x-text="error"></span>
                                </p>
                            </div>
                            <div class="flex w-full sm:w-auto gap-3">
                                <button @click="reset()"
                                    class="flex-1 sm:flex-none px-6 py-4 rounded-xl bg-white text-slate-600 border border-slate-200 font-bold hover:bg-slate-50 active:scale-95 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                                    Reset
                                </button>
                                <button @click="calculate()" :disabled="loading || !rawUrls.trim()"
                                    class="flex-1 sm:flex-none px-10 py-4 rounded-xl bg-slate-900 text-white font-bold hover:bg-blue-600 hover:shadow-xl hover:shadow-blue-600/20 active:scale-95 transition-all disabled:opacity-50 flex items-center justify-center gap-3 shadow-lg">
                                    <i x-show="!loading" data-lucide="zap" class="h-4 w-4"></i>
                                    <i x-show="loading" data-lucide="loader-2" class="animate-spin h-4 w-4"></i>
                                    <span x-text="loading ? 'Processing...' : 'Calculate'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Calculation Results (Table) -->
                <!-- ... existing table remains ... -->
                <div x-show="results" x-cloak
                    class="bg-white rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-xl transition-all overflow-hidden min-w-full">
                    <div
                        class="px-6 md:px-10 py-6 md:py-8 border-b border-slate-100 flex items-center justify-between bg-slate-50/30">
                        <h3 class="font-bold text-slate-900 text-lg">Queue Totals</h3>
                        <button @click="copyResults()"
                            class="text-xs font-black uppercase text-blue-600 flex items-center gap-2 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-xl transition-all shadow-sm border border-blue-100">
                            <i data-lucide="copy" class="h-3.5 w-3.5"></i>
                            <span x-text="copied ? 'Copied' : 'Copy Results'"></span>
                        </button>
                    </div>
                    <div class="overflow-x-auto scrollbar-hide">
                        <table class="w-full text-left table-auto border-collapse">
                            <thead class="bg-slate-50/50 border-b border-slate-100">
                                <tr class="text-[11px] font-black uppercase tracking-[0.2em] text-slate-400">
                                    <th class="px-6 md:px-10 py-5">Playlist</th>
                                    <th class="px-4 md:px-6 py-5 text-center">Items</th>
                                    <th class="px-4 md:px-6 py-5 text-right">Duration</th>
                                    <th class="px-6 md:px-10 py-5 text-right">Adjusted</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                <template x-for="p in (results?.playlists || [])">
                                    <tr class="hover:bg-blue-50/30 transition-colors group/row">
                                        <td class="px-6 md:px-10 py-5">
                                            <a :href="'https://www.youtube.com/playlist?list=' + p.id" target="_blank"
                                                class="font-bold text-sm md:text-base text-slate-900 line-clamp-1 hover:text-blue-600 transition-colors flex items-center gap-2">
                                                <span x-text="p.title"></span>
                                                <i data-lucide="external-link"
                                                    class="h-3.5 w-3.5 opacity-0 group-hover/row:opacity-100 transition-opacity"></i>
                                            </a>
                                            <div class="text-[10px] text-slate-400 font-mono mt-1 opacity-70"
                                                x-text="p.id"></div>
                                        </td>
                                        <td class="px-4 md:px-6 py-5 text-center font-bold text-slate-600 text-sm md:text-base"
                                            x-text="p.videoCount"></td>
                                        <td class="px-4 md:px-6 py-5 text-right text-xs md:text-sm font-bold text-slate-400 whitespace-nowrap"
                                            x-text="formatSeconds(p.durationSeconds)"></td>
                                        <td class="px-6 md:px-10 py-5 text-right text-sm md:text-lg font-black text-blue-600 whitespace-nowrap"
                                            x-text="formatSeconds(p.durationSeconds / speed)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Configuration Sidebar -->
            <div class="lg:col-span-4 space-y-6">
                <!-- Parameter Control -->
                <div
                    class="bg-white p-6 md:p-8 rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-xl transition-all relative overflow-hidden group">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="h-8 w-8 rounded-lg bg-blue-50 flex items-center justify-center">
                            <i data-lucide="settings-2" class="h-4 w-4 text-blue-600"></i>
                        </div>
                        <span class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Settings</span>
                    </div>

                    <div class="space-y-8">
                        <div>
                            <label
                                class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Playback
                                Speed</label>
                            <div class="grid grid-cols-4 gap-2">
                                <template x-for="s in [1, 1.25, 1.5, 2]">
                                    <button @click="speed = s"
                                        :class="speed === s ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-white text-slate-500 border-slate-200 hover:border-slate-300'"
                                        class="py-2.5 rounded-xl text-xs font-bold transition-all border"
                                        x-text="s + 'x'"></button>
                                </template>
                            </div>
                            <div
                                class="mt-3 flex items-center justify-between gap-4 bg-slate-50/50 p-3 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors group/input">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Custom
                                    Rate</span>
                                <div class="flex items-center gap-1">
                                    <input type="number" x-model.number="speed" step="0.05" min="0.1" max="10"
                                        class="w-16 bg-transparent border-none focus:ring-0 text-sm font-black text-blue-600 p-0 text-right outline-none"
                                        placeholder="1.0">
                                    <span
                                        class="text-xs font-bold text-slate-300 group-hover/input:text-blue-300">x</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label
                                class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Segment
                                Filter</label>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="relative group/field">
                                    <input type="number" x-model.number="range.start" min="1"
                                        class="w-full p-4 rounded-xl bg-slate-50/50 border border-slate-100 text-center text-sm font-bold transition-all focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/5 outline-none"
                                        placeholder="Start">
                                    <span
                                        class="absolute top-0 left-0 -mt-2 ml-3 px-1 bg-white text-[9px] font-black text-slate-300 uppercase tracking-tighter opacity-0 group-focus-within/field:opacity-100 transition-opacity">From</span>
                                </div>
                                <div class="relative group/field">
                                    <input type="number" x-model.number="range.end" min="1"
                                        class="w-full p-4 rounded-xl bg-slate-50/50 border border-slate-100 text-center text-sm font-bold transition-all focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/5 outline-none"
                                        placeholder="End">
                                    <span
                                        class="absolute top-0 left-0 -mt-2 ml-3 px-1 bg-white text-[9px] font-black text-slate-300 uppercase tracking-tighter opacity-0 group-focus-within/field:opacity-100 transition-opacity">To</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dashboard Analytics -->
                <div x-show="results" x-cloak
                    class="bg-slate-900 p-8 md:p-10 rounded-[3rem] shadow-2xl space-y-10 relative overflow-hidden group/dash">
                    <div
                        class="absolute top-0 right-0 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl -mr-24 -mt-24 group-hover/dash:bg-blue-500/30 transition-all duration-700">
                    </div>

                    <div class="space-y-2">
                        <p class="text-[11px] font-black text-slate-500 uppercase tracking-[0.3em]">Queue Total</p>
                        <div class="flex items-baseline gap-3 overflow-hidden">
                            <h4 class="text-3xl md:text-4xl font-black text-white whitespace-nowrap"
                                x-text="formatSeconds(results?.totalSeconds)"></h4>
                            <span class="text-[11px] text-slate-600 font-bold uppercase tracking-widest">Base</span>
                        </div>
                    </div>

                    <div class="pt-8 border-t border-slate-800/50 space-y-2">
                        <p class="text-[11px] font-black text-blue-500 uppercase tracking-[0.3em]">Adjusted Goal</p>
                        <div class="flex items-baseline gap-3 overflow-hidden">
                            <h4 class="text-3xl md:text-5xl font-black text-blue-500 whitespace-nowrap"
                                x-text="formatSeconds((results?.totalSeconds || 0) / speed)"></h4>
                            <span class="text-[11px] text-slate-600 font-bold uppercase tracking-widest"
                                x-text="'@ ' + speed + 'x'"></span>
                        </div>
                    </div>

                    <div class="pt-8 border-t border-slate-800/50 grid grid-cols-2 gap-8">
                        <div>
                            <p class="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-2">Items</p>
                            <p class="text-2xl font-black text-white" x-text="results?.totalVideos"></p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-2">Avg Depth</p>
                            <p class="text-2xl font-black text-white whitespace-nowrap"
                                x-text="formatSeconds(results?.averageDurationSeconds)"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="max-w-7xl mx-auto px-6 py-16 border-t border-slate-200">
        <div class="flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="space-y-4 text-center md:text-left">
                <h3 class="font-black text-2xl tracking-tight text-slate-900">PlaylistIQ</h3>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-[0.3em]">© 2026 - <b>Yahya Saad</b></p>
            </div>
            <div class="flex items-center gap-6">
                <a href="https://linkedin.com/in/yahya-saad" target="_blank"
                    class="h-12 w-12 flex items-center justify-center rounded-2xl bg-white border border-slate-200 text-slate-400 hover:text-blue-600 hover:border-blue-100 hover:shadow-lg hover:shadow-blue-500/5 transition-all">
                    <i data-lucide="linkedin" class="h-6 w-6"></i>
                </a>
                <a href="https://github.com/yahya-saad" target="_blank"
                    class="h-12 w-12 flex items-center justify-center rounded-2xl bg-white border border-slate-200 text-slate-400 hover:text-slate-900 hover:border-slate-300 hover:shadow-lg transition-all">
                    <i data-lucide="github" class="h-6 w-6"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Export Toast -->
    <div x-show="copied" x-transition x-cloak
        class="fixed bottom-10 right-10 bg-slate-900 border border-blue-500/20 text-white px-6 py-4 rounded-2xl shadow-2xl z-[100] text-sm font-bold flex items-center gap-3">
        <i data-lucide="check-circle-2" class="h-4 w-4 text-blue-400"></i>
        <span x-text="toastMessage"></span>
    </div>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PlaylistIQ",
      "operatingSystem": "Web",
      "applicationCategory": "MultimediaApplication",
      "description": "Simple tool to calculate how long a YouTube playlist will take.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
</body>

</html>
